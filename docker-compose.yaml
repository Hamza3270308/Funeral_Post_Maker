version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Ports section removed so Coolify handles the routing via Traefik automatically
    environment:
      - NODE_ENV=production
      - PORT=5001
      # - MONGO_URI=${MONGO_URI}
    restart: unless-stopped
    volumes:
      - backend-uploads:/app/uploads

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    # Ports section removed so Coolify handles the routing via Traefik automatically
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

volumes:
  backend-uploads:
