version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Ports section removed so Coolify handles the routing via Traefik automatically
    environment:
      - NODE_ENV=production
      - PORT=5001
      # - MONGO_URI=${MONGO_URI}
    restart: unless-stopped
    volumes:
      - backend-uploads:/app/uploads

volumes:
  backend-uploads:
